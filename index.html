<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<link rel="stylesheet" href="/sky-guide/assets/uni.a75bb826.css">

	<meta charset="UTF-8" />
	<!-- 红石天气、活动日历是接口返回的第三方图床外链，带 Referer 会被防盗链拦；整站关闭 Referer 让这些图能显示 -->
	<meta name="referrer" content="no-referrer" />
	<script>
		// 首屏底色跟随主题，避免重载瞬间露白底
		(function () {
			var mode, saved, dark;
			try {
				mode = localStorage.getItem('sky_guide_theme_mode');
				saved = localStorage.getItem('sky_guide_theme');
			} catch (e) {}
			var h = new Date().getHours();
			dark = mode === 'manual' && (saved === 'dark' || saved === 'light')
				? saved === 'dark'
				: (h < 6 || h >= 18);
			document.documentElement.dataset.theme = dark ? 'dark' : 'light';
		})();
	</script>
	<style>
		html[data-theme="dark"] { --boot-bg: #07090E; }
		html[data-theme="light"] { --boot-bg: #EEF1F7; }
		html, body { background: var(--boot-bg, #EEF1F7); }
	</style>
	<script>
			var coverSupport =
				'CSS' in window &&
				typeof CSS.supports === 'function' &&
				(CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'));
			document.write(
				'<meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no' +
					(coverSupport ? ',viewport-fit=cover' : '') +
					'" />'
			);
		</script>
