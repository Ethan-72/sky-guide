<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>摸小猫 · 写实照片版预览</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
 background:linear-gradient(165deg,#f3eaf9,#eaf0fc 50%,#fbeef4);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:390px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.8);border-radius:32px;padding:20px;
 backdrop-filter:blur(20px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 10px 36px rgba(90,80,140,.15)}
.coatbar{display:flex;align-items:center;height:27px;padding:0 8px;border-radius:999px;background:rgba(255,255,255,.5);
 border:1px solid rgba(255,255,255,.7);width:max-content;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.label{font-size:10px;color:#888;letter-spacing:.5px;margin-right:6px}
.dots{display:flex;gap:5px}.dot{width:15px;height:15px;border-radius:50%;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 1px 3px rgba(0,0,0,.18);cursor:pointer;transition:transform .2s,box-shadow .2s}
.dot.on{transform:scale(1.28);box-shadow:0 0 0 2px #E5487F,0 2px 5px rgba(0,0,0,.24)}
.cname{font-size:10px;font-weight:600;color:#E5487F;letter-spacing:.5px;margin-left:7px;min-width:38px}
.stage{position:relative;height:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.halo{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,150,200,.3),rgba(255,255,255,0) 66%);opacity:0;transform:translateY(10px) scale(.7);transition:opacity .4s,transform .4s;pointer-events:none}
.halo.on{opacity:1;transform:scale(1.06)}
.photo{position:relative;width:190px;height:190px;border-radius:46%;object-fit:cover;filter:drop-shadow(0 8px 14px rgba(60,50,90,.22));
 -webkit-mask-image:radial-gradient(circle at 50% 46%,#000 0%,#000 62%,rgba(0,0,0,0) 78%);mask-image:radial-gradient(circle at 50% 46%,#000 0%,#000 62%,rgba(0,0,0,0) 78%);pointer-events:none}
.patted{animation:squish .38s cubic-bezier(.34,1.56,.64,1)}
@keyframes squish{0%{transform:scale(1)}20%{transform:scale(1.06,.9) translateY(6px)}55%{transform:scale(.95,1.06) translateY(-3px)}100%{transform:scale(1)}}
.heart{position:absolute;z-index:5;background:linear-gradient(150deg,#FF9EC4,#FF5E9C 55%,#E5347C);
 clip-path:polygon(50% 100%,8% 56%,0 32%,4% 12%,22% 2%,38% 6%,50% 20%,62% 6%,78% 2%,96% 12%,100% 32%,92% 56%);
 filter:drop-shadow(0 0 5px rgba(255,130,185,.85));opacity:0;pointer-events:none;animation:float 1.5s cubic-bezier(.22,.7,.3,1) forwards}
@keyframes float{0%{opacity:0;transform:translate(-50%,10px) scale(.4) rotate(var(--hrot,0deg))}
 18%{opacity:1;transform:translate(-50%,-5px) scale(1.1) rotate(var(--hrot,0deg))}
 60%{opacity:1;transform:translate(calc(-50% + 8px),-55px) scale(1) rotate(calc(var(--hrot,0deg) + 12deg))}
 100%{opacity:0;transform:translate(calc(-50% - 6px),-115px) scale(1.15) rotate(calc(var(--hrot,0deg) - 10deg))}}
.hint{position:relative;z-index:3;margin-top:6px;text-align:center;font-size:11px;color:#999;letter-spacing:.5px}
.count{text-align:center;font-size:11px;color:#777;margin-top:5px}.num{font-size:13px;font-weight:700;color:#E5487F}
</style></head><body>
